name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - ready_for_review
      - locked
      - unlocked
      - milestoned
      - demilestoned
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
      - enqueued
      - dequeued

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cput_housing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cput_housing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: cput_housing
      DB_PASSWORD: postgres
      DB_PORT: 5432
      # Ephemeral CI credential only. Not a production secret.
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # README requires Node.js 22 or later.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
